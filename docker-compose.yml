services:
  mysql:
    image: mysql:8.4
    container_name: condolio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: condolio_root_pw
      MYSQL_DATABASE: condolio
      MYSQL_USER: condolio
      MYSQL_PASSWORD: condolio_pw
    ports:
      - "3306:3306"
    volumes:
      - condolio-mysql-data:/var/lib/mysql

volumes:
  condolio-mysql-data:
